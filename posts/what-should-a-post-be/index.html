  <h1>What Should a Post Be</h1>
  <time datetime=2026-02-05T21:43:53&#43;0800 class="post-date">Thu, Feb 5, 2026</time>
  <p>什么样的东西值得被写成一篇博文？或者说，一篇博文应该是什么样的？这里仅仅是对自己发问，我对我的博客定位如何，想在这里写点什么样的东西。</p>
<p>入门的人害怕“重复造轮子”，在自己什么都不会的时候拼尽全力去做的事，可能前人早已为你解决，并且解决得比你好，发现这一事实后，就会感到自己白白浪费了许多时间，自我怀疑做了无用功。</p>
